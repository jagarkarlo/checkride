name: Release

# A v* tag builds every artifact and creates a GitHub pre-release. Publishing to
# PyPI is public and irreversible, so it only runs from a manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Nostekon release tag to rebuild, for example v0.1.1"
        required: true
        type: string
      publish-pypi:
        description: "Also publish the Python package to PyPI (public, irreversible)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Require a Nostekon release tag
        shell: bash
        run: |
          if [[ ! -f src/nostekon/__init__.py ]]; then
            printf '%s\n' 'This tag predates Nostekon. Create a new release tag; do not republish the historical release.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Python distributions
        run: |
          python -m pip install build
          python -m build --outdir release/
      - name: Go binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            for cmd in nostekon-api nostekon-report nostekon-attest; do
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "release/${cmd}_${os}_${arch}${ext}" "./cmd/$cmd"
            done
          done
      - name: Studio and installable app bundles
        working-directory: studio
        run: |
          npm ci
          npm run build
          tar -czf ../release/nostekon-studio.tar.gz -C dist .
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [[ "$os" = windows ]]; then ext=.exe; fi
            bundle="$RUNNER_TEMP/nostekon-app-${os}-${arch}"
            mkdir -p "$bundle/studio"
            cp "../release/nostekon-api_${os}_${arch}${ext}" "$bundle/nostekon-api${ext}"
            cp -R dist/. "$bundle/studio/"
            cp ../README.md "$bundle/README.md"
            tar -czf "../release/nostekon-app_${os}_${arch}.tar.gz" -C "$bundle" .
          done
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

  github-release:
    name: GitHub pre-release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release/
      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          title="Nostekon $TAG - installable evidence app"
          body='Nostekon pre-alpha release: a one-process Studio and Go API app, DrillRun evidence evaluation, V0-V4 verdicts, phased RTO, acknowledged-write RPO, policy-suite review, browser-local run saving, and report/Ed25519 attestation CLIs. Extract a nostekon-app archive and start nostekon-api with NOSTEKON_STUDIO_DIR=./studio. The app reviews evidence; it does not launch restores. Browser-launched isolated drill execution, server-side run storage and authenticated multi-user deployment remain planned. This release does not publish to PyPI.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$body" --prerelease
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$body" --prerelease
          fi

  publish:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish-pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nostekon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release/
      - name: Select Python distributions
        run: mkdir dist && cp release/nostekon-*.whl release/nostekon-[0-9]*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
