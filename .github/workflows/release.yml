name: Release

# A v* tag builds every artifact and creates a GitHub pre-release. Publishing to
# PyPI is public and irreversible, so it only runs from a manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, for example v0.1.0"
        required: true
        type: string
        default: v0.1.0
      publish-pypi:
        description: "Also publish the Python package to PyPI (public, irreversible)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Python distributions
        run: |
          python -m pip install build
          python -m build --outdir release/
      - name: Go binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            for cmd in checkride-api checkride-report checkride-attest; do
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "release/${cmd}_${os}_${arch}${ext}" "./cmd/$cmd"
            done
          done
      - name: Studio bundle
        working-directory: studio
        run: |
          npm ci
          npm run build
          tar -czf ../release/checkride-studio.tar.gz -C dist .
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

  github-release:
    name: GitHub pre-release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release/
      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          title="Checkride $TAG — verified evidence reporting"
          body='Checkride pre-alpha release: DrillRun evidence evaluation, V0–V4 verdicts, phased RTO, acknowledged-write RPO, local report and Ed25519 attestation CLIs, Studio evidence review, and the multi-page product site. Restore execution is the next roadmap step.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$body" --prerelease
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$body" --prerelease
          fi

  publish:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish-pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/checkride
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release/
      - name: Select Python distributions
        run: mkdir dist && cp release/checkride-*.whl release/checkride-[0-9]*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
