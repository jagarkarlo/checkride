name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Report API smoke test
        run: scripts/ci/report-api-smoke.sh

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Validate example drills
        run: checkride validate examples/drills/*.yaml

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
      - name: Verify public package sources
        run: |
          node -e 'const lock = require("./package-lock.json"); const invalid = Object.values(lock.packages).filter(pkg => pkg.resolved && new URL(pkg.resolved).origin !== "https://registry.npmjs.org"); if (invalid.length) { console.error(`${invalid.length} packages use a non-public registry`); process.exit(1); }'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '..[docs]'
      - name: Verify public package sources
        run: |
          node -e 'const lock = require("./package-lock.json"); const invalid = Object.values(lock.packages).filter(pkg => pkg.resolved && new URL(pkg.resolved).origin !== "https://registry.npmjs.org"); if (invalid.length) { console.error(`${invalid.length} packages use a non-public registry`); process.exit(1); }'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
          - run: npm ci --prefix ../studio
      - run: npm run build
      - name: Verify rendered product routes and assets
        working-directory: .
        run: scripts/ci/site-smoke.sh site
