name: Isolated restore lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkride-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore:
    name: PostgreSQL V4 restore gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lab tools
        run: |
          python -m pip install -e .
          go install github.com/k3d-io/k3d/v5@v5.8.3
          command -v kubectl
          command -v jq
          docker info >/dev/null
      - name: Create isolated clusters
        run: make lab-up
      - name: Run restore drill
        run: |
          mkdir -p lab-results
          nostekon lab run --writes 10 --output lab-results/drillrun.json
      - name: Evaluate V4 evidence
        run: |
          go run ./cmd/checkride-report lab-results/drillrun.json >lab-results/report.json
          jq -e '
            .verdict == "verified" and
            .requestedLevel == "V4" and
            .deepestPassed == "V4" and
            .firstFailed == null and
            .rpo.acknowledged == 10 and
            .rpo.recovered == 10 and
            .rpo.lost == 0 and
            .rpo.holes == 0 and
            .rpo.unexpected == 0 and
            .rpo.seconds == 0 and
            .rpo.met == true and
            (.levels[] | select(.id == "V4") | .checks |
              any(.name == "probe-write-preserved" and .passed == true))
          ' lab-results/report.json >/dev/null
      - name: Verify deliberate acknowledged-write loss
        run: |
          if nostekon lab run --writes 10 --after-backup-writes 2 \
            --output lab-results/tail-loss.drillrun.json; then
            echo "Tail-loss drill unexpectedly passed" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          go build -o "$RUNNER_TEMP/checkride-report" ./cmd/checkride-report
          if "$RUNNER_TEMP/checkride-report" lab-results/tail-loss.drillrun.json \
            >lab-results/tail-loss.report.json; then
            echo "Tail-loss report unexpectedly passed" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          jq -e '
            .verdict == "failed" and
            .requestedLevel == "V4" and
            .deepestPassed == "V3" and
            .firstFailed == "V4" and
            .rpo.acknowledged == 12 and
            .rpo.recovered == 10 and
            .rpo.lost == 2 and
            .rpo.holes == 0 and
            .rpo.unexpected == 0 and
            .rpo.met == false and
            (.levels[] | select(.id == "V4") | .checks |
              any(.source == "ledger" and .passed == false))
          ' lab-results/tail-loss.report.json >/dev/null
      - name: Verify acknowledged-write loss within an explicit RPO budget
        run: |
          nostekon lab run --writes 10 --after-backup-writes 2 --rpo-seconds 60 \
            --output lab-results/budget-loss.drillrun.json
          "$RUNNER_TEMP/checkride-report" lab-results/budget-loss.drillrun.json \
            >lab-results/budget-loss.report.json
          jq -e '
            .verdict == "verified" and
            .requestedLevel == "V4" and
            .deepestPassed == "V4" and
            .firstFailed == null and
            .rpo.acknowledged == 12 and
            .rpo.recovered == 10 and
            .rpo.lost == 2 and
            .rpo.holes == 0 and
            .rpo.unexpected == 0 and
            .rpo.consistent == true and
            .rpo.seconds > 0 and
            .rpo.seconds <= 60 and
            .rpo.objectiveSeconds == 60 and
            .rpo.met == true and
            (.levels[] | select(.id == "V4") | .checks |
              any(.source == "ledger" and .passed == true))
          ' lab-results/budget-loss.report.json >/dev/null
      - name: Remove disposable clusters
        if: always()
        run: |
          if command -v k3d >/dev/null; then
            make lab-down
          fi
      - name: Upload lab evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab-results/
          if-no-files-found: ignore
          retention-days: 7